<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="한글 획수로 알아보는 두 사람의 이름 궁합"><title>두근두근 이름 궁합</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><main class="page-shell"><section class="card" aria-labelledby="page-title"><p class="eyebrow">LOVE COMPATIBILITY</p><h1 id="page-title">두근두근<br><em>이름 궁합</em></h1><p class="intro">두 사람의 이름으로 오늘의 설레는 궁합을 확인해 보세요.</p><form id="compatibility-form" novalidate><div class="name-row"><label class="name-field" for="first-name"><span>첫 번째 이름</span><input id="first-name" type="text" maxlength="6" placeholder="홍길동" autocomplete="off"></label><span class="heart" aria-hidden="true">♥</span><label class="name-field" for="second-name"><span>두 번째 이름</span><input id="second-name" type="text" maxlength="6" placeholder="김첨지" autocomplete="off"></label></div><p class="help">한글 이름 2~6글자를 입력해 주세요.</p><p class="error" id="error-message" role="alert" aria-live="polite"></p><button type="submit">우리 궁합 확인하기 <span>→</span></button></form><section class="result" id="result" aria-live="polite" hidden><div class="result-top"><span>두 사람의 궁합 점수</span><button class="reset" id="reset-button" type="button">다시 하기</button></div><div class="score-wrap"><strong id="score">00</strong><span>%</span></div><h2 id="result-title"></h2><p id="result-comment"></p><p class="calculation" id="calculation"></p></section></section><p class="notice">이 결과는 재미로 보는 이름 궁합입니다 · 자체 한글 획수표 사용</p></main><script src="app.js"></script></body></html>
